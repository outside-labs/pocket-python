[project]
name = "pocket-python"
version = "0.2.0"
description = "Auditable compiled JavaScript and supplied MicroPython offline application bundles"
readme = "README.md"
authors = [{ name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
pocket-python = "pocket_python.cli:main"

[project.urls]
Repository = "https://github.com/outside-labs/pocket-python"
Issues = "https://github.com/outside-labs/pocket-python/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
browser-tests = [
    "playwright==1.64.0",
]
compiled-build = [
    "python-javascript==0.2.0",
]
