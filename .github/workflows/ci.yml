        with:
          name: interpreter-node-report
          path: |
            build/*node-report.json
            build/*node-stepped-report.json
            build/interpreter-node-measurements/report.json
            build/classes-reference-report.json
            build/function-binding-reference-report.json
            build/ordinary-syntax-reference-report.json
            build/iteration-reference-report.json
            build/equality-reference-report.json
            build/numeric-reference-report.json
