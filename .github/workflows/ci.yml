name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/run_tests.py smoke
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: main-smoke
          path: build/test-results/
          if-no-files-found: error

  test:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.14.7'
      POCKET_PYTHON_RUNTIME: ${{ github.workspace }}/build/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked --group compiled-build
      - run: uv run --no-sync python scripts/run_tests.py python
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: python-${{ matrix.os }}
          path: build/test-results/
          if-no-files-found: error

  interpreter:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.14.7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/run_tests.py interpreter --shard ${{ matrix.shard }} --shards 4
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: interpreter-${{ matrix.shard }}
          path: |
            build/test-results/
            build/*-report.json
          if-no-files-found: error

  browser:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: browser-conformance, shard: 1, shards: 4}
          - {suite: browser-conformance, shard: 2, shards: 4}
          - {suite: browser-conformance, shard: 3, shards: 4}
          - {suite: browser-conformance, shard: 4, shards: 4}
          - {suite: browser-integration, shard: 1, shards: 3}
          - {suite: browser-integration, shard: 2, shards: 3}
          - {suite: browser-integration, shard: 3, shards: 3}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UV_PYTHON: '3.14.7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked --group browser-tests --group compiled-build
      - run: uv run --no-sync python scripts/run_tests.py prepare-browser
      - if: matrix.suite == 'browser-integration'
        run: uv run --no-sync python scripts/prepare_runtime.py
      - run: uv run --no-sync python scripts/run_tests.py ${{ matrix.suite }} --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            build/test-results/
            build/*-report.json
          if-no-files-found: error

  measurements:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UV_PYTHON: '3.14.7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked --group browser-tests --group compiled-build
      - run: uv run --no-sync python scripts/prepare_runtime.py
      - run: uv run --no-sync python scripts/run_tests.py prepare-browser
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: outside-labs/Python-JavaScript
          ref: 804a70fa37ef4ca126519c7222d1862966a63d0c
          path: build/compiler-reference
          persist-credentials: false
      - run: uv run --no-sync python scripts/run_tests.py reference measurements smoke
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: validation-measurements
          path: |
            build/test-results/
            build/*-report.json
            build/*measurements/report.json
            build/application-measurements/compiler-component-report.json
          if-no-files-found: error
