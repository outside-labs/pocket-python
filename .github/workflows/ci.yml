      - run: python runtime/check_classes.py --corpus tests/fixtures/interpreter/formatting.json --stepped --report build/formatting-stepped-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/indexing.json --report build/indexing-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/iteration.json --report build/iteration-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/equality.json --report build/equality-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/equality.json --stepped --report build/equality-stepped-node-report.json
      - run: python runtime/check_classes.py --reference-only --corpus tests/fixtures/interpreter/numeric.json --report build/numeric-reference-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/numeric.json --stages N1 N2 N3 N4 N5 Future --report build/numeric-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/numeric.json --stages N1 N2 N3 N4 N5 Future --stepped --report build/numeric-stepped-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/iteration.json --stepped --report build/iteration-stepped-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/indexing.json --stepped --report build/indexing-stepped-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/sequences.json --stages Q1 Q2 Q3 Hints --report build/sequences-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/sequences.json --stages Q1 Q2 Q3 Hints --stepped --report build/sequences-node-stepped-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/sequences.json --profile core-source/1 --report build/sequences-core-node-report.json
      - run: python runtime/check_classes.py --target node --corpus tests/fixtures/interpreter/sequences.json --profile core-source/1 --stepped --report build/sequences-core-node-stepped-report.json
      - run: python runtime/check_compatibility.py --target node --report build/compatibility-node-report.json
      - run: python runtime/check_library_profiles.py --report build/library-profiles-node-report.json
      - run: python scripts/interpreter_measurements.py --no-browser --repeats 3 --output build/interpreter-node-measurements
        env:
          PYTHONPATH: src
      - run: python runtime/check_memory.py --report build/memory-node-report.json
      - run: python runtime/check_conformance.py --report build/interpreter-node-report.json
