name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      POCKET_PYTHON_RUNTIME: ${{ github.workspace }}/build/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group compiled-build
      - run: uv run --no-sync python scripts/prepare_runtime.py
      - run: uv run --no-sync python scripts/lock_interpreter.py
      - run: uv run --no-sync python scripts/lock_library_profiles.py
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --no-sync python scripts/check_distributions.py

  browser:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.14.7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group browser-tests --group compiled-build
      - run: uv run --no-sync python scripts/prepare_runtime.py
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python scripts/compiled_browser_smoke.py --report build/compiled-browser-report.json
      - run: uv run --no-sync python scripts/shared_application_smoke.py --report build/shared-application-browser-report.json
      - run: uv run --no-sync python scripts/interpreter_browser_smoke.py --report build/interpreter-console-browser-report.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: outside-labs/Python-JavaScript
          ref: 804a70fa37ef4ca126519c7222d1862966a63d0c
          path: build/compiler-reference
          persist-credentials: false
      - run: uv run --no-sync python scripts/measure_applications.py --compiler-report build/compiler-reference/docs/measurements/2026-10-20-compiler.json --repeats 3 --output build/application-measurements
      - run: uv run --no-sync python scripts/browser_smoke.py
      - run: uv run --no-sync python runtime/check_memory.py --target browser --report build/memory-browser-report.json
      - run: uv run --no-sync python runtime/browser_smoke.py
      - run: uv run --no-sync python runtime/check_conformance.py --target browser --report build/interpreter-browser-report.json
      - run: uv run --no-sync python runtime/check_conformance.py --engine vm1 --target browser --report build/vm1-browser-report.json
      - run: uv run --no-sync python runtime/check_conformance.py --engine vm2 --target browser --report build/vm2-browser-report.json
      - run: uv run --no-sync python runtime/check_conformance.py --engine vm3 --target browser --report build/vm3-browser-report.json
      - run: uv run --no-sync python runtime/check_functions.py --target browser --report build/functions-browser-report.json
      - run: uv run --no-sync python runtime/check_conformance.py --engine vm4 --target browser --report build/modules-browser-report.json
      - run: uv run --no-sync python runtime/check_source_tokens.py --target browser --report build/source-tokens-browser-report.json
      - run: uv run --no-sync python runtime/check_conformance.py --engine source --target browser --report build/source-browser-report.json
      - run: uv run --no-sync python runtime/check_library_profiles.py --target browser --report build/library-profiles-browser-report.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: interpreter-browser-report
          path: |
            build/*browser-report.json
            build/application-measurements/report.json
            build/application-measurements/compiler-component-report.json
          if-no-files-found: error

  interpreter-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'
      - run: node --test runtime/prototype.test.mjs
      - run: node --test runtime/vm.test.mjs
      - run: node --test runtime/values.test.mjs
      - run: node --test runtime/memory.test.mjs
      - run: node --test runtime/functions.test.mjs
      - run: node --test runtime/module-registry.test.mjs
      - run: node --test runtime/modules.test.mjs
      - run: node --test runtime/source-tokens.test.mjs
      - run: node --test runtime/source.test.mjs
      - run: node --test runtime/browser-host.test.mjs
      - run: node --test runtime/library-profiles.test.mjs
      - run: python runtime/generate_identifiers.py --check
      - run: python runtime/check_source_tokens.py --report build/source-tokens-node-report.json
      - run: python runtime/check_conformance.py --engine source --report build/source-node-report.json
      - run: python scripts/lock_library_profiles.py
      - run: python runtime/check_library_profiles.py --report build/library-profiles-node-report.json
      - run: python runtime/check_memory.py --report build/memory-node-report.json
      - run: python runtime/check_conformance.py --report build/interpreter-node-report.json
      - run: python runtime/check_conformance.py --engine vm1 --report build/vm1-node-report.json
      - run: python runtime/check_conformance.py --engine vm2 --report build/vm2-node-report.json
      - run: python runtime/check_conformance.py --engine vm3 --report build/vm3-node-report.json
      - run: python runtime/check_functions.py --report build/functions-node-report.json
      - run: python runtime/check_conformance.py --engine vm4 --report build/modules-node-report.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: interpreter-node-report
          path: build/*node-report.json
          if-no-files-found: error
